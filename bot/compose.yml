services:
  bot:                      # off since 2026-10-20 (the site replaced it): `--profile discord up -d bot` to bring it back
    profiles: ["discord"]
    build:
      context: ..
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: .env          # DISCORD_TOKEN=..., optional DISCORD_GUILD_ID=... (chmod 600)
    environment:
      BOT_WORKERS: 4        # songs at once; each takes one core and up to ~0.6 GB
    cpus: 4.0               # the home server (12 threads) also runs game servers
    mem_limit: 4g
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  api:                      # HTTP API behind auneu.space/timing (the VPS reaches it through an SSH tunnel)
    build:
      context: ..
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    command: ["python", "web/api.py"]
    environment:
      API_HOST: 0.0.0.0
      API_WORKERS: 6        # songs at once from the site
      MARATHON_WORKERS: 1   # plus one marathon (up to 60 min) at a time, in its own process,
      MARATHON_THREADS: 4   # on 4 cores (37 min: 47 s on one, 26 s on 4; 8 barely faster)
    ports:
      - "127.0.0.1:8431:8431"   # localhost only
    cpus: 11.0              # 7 for songs (the bot's 4 cores went to the site), 4 for the marathon; 1 of 12 left to the host
    mem_limit: 9g           # 6 songs of 15 min (~0.7 GB each) + a 60 min marathon (~2.2 GB)
    cap_drop: [ALL]         # strangers' files go through a native decoder in here
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    logging:
      options:
        max-size: "5m"
        max-file: "2"
