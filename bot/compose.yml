services:
  bot:                      # off since 2026-10-20 (the site replaced it): `--profile discord up -d bot` to bring it back
    profiles: ["discord"]
    build:
      context: ..
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: .env          # DISCORD_TOKEN=..., optional DISCORD_GUILD_ID=... (chmod 600)
    environment:
      BOT_WORKERS: 4        # songs at once; each takes one core and up to ~0.6 GB
    cpus: 4.0               # the host runs other things too
    mem_limit: 4g
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  api:                      # HTTP API behind auneu.space/timing (the VPS reaches it through an SSH tunnel)
    build:
      context: ..
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    command: ["python", "web/api.py"]
    environment:
      API_HOST: 0.0.0.0
      API_WORKERS: 6        # songs at once from the site
      MARATHON_WORKERS: 1   # plus one marathon (up to 60 min) at a time, in its own process,
      MARATHON_THREADS: 2   # on 2 threads (37 min: 47 s on one, 26 s on 4)
    ports:
      - "127.0.0.1:8431:8431"   # localhost only
    volumes:
      - feedback:/data/feedback # songs + timings visitors fixed (bench/fetch_site.sh copies them out)
      - usage:/data/usage       # usage.jsonl: a line per upload, refusal and fix (bench/fetch_usage.sh)
    cpus: 7.0               # all of it, marathon included: the host can't spare more (songs and a marathon share when busy)
    mem_limit: 6g           # stress test: 6 songs of 14.5 min 3.05 GB at most, a 37 min marathon 1.4 GB (60 min ~2.2)
    cap_drop: [ALL]         # strangers' files go through a native decoder in here
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    logging:
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  feedback:
  usage:
