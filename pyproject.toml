[project]
name = "autotiming"
version = "0.1.0"
description = "Accurate BPM/offset/red-line detection for osu! maps"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "requests",
    "numba>=0.68.0",
]

[project.optional-dependencies]
# competitors for the benchmark only
# librosa 1.0's numba beat tracker segfaults (__last_beat); 0.11 is the long-standing release
baselines = ["librosa>=0.10,<0.12", "essentia"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotiming"]
