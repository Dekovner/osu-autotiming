services:
  bot:                      # off since 2026-10-20 (the site replaced it): `--profile discord up -d bot` to bring it back
    profiles: ["discord"]
    build:
      context: ..
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: .env          # DISCORD_TOKEN=..., optional DISCORD_GUILD_ID=... (chmod 600)
    environment:
      BOT_WORKERS: 4        # songs at once; each takes one core and up to ~0.6 GB
    cpus: 4.0               # the home server (12 threads) also runs game servers
    mem_limit: 4g
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  api:                      # HTTP API behind auneu.space/timing (the VPS reaches it through an SSH tunnel)
    build:
      context: ..
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    command: ["python", "web/api.py"]
    environment:
      API_HOST: 0.0.0.0
      API_WORKERS: 6        # songs at once from the site
    ports:
      - "127.0.0.1:8431:8431"   # localhost only
    cpus: 7.0               # the bot's 4 cores went to the site when the bot was switched off
    mem_limit: 6g
    cap_drop: [ALL]         # strangers' files go through a native decoder in here
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    logging:
      options:
        max-size: "5m"
        max-file: "2"
