[project]
name = "autotiming"
version = "0.1.0"
description = "Accurate BPM/offset/red-line detection for osu! maps"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "scipy", "requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotiming"]
